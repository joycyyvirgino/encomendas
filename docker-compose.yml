# Por enquanto só o Postgres. O serviço da app entra na semana 8 (Dockerfile).
services:
  postgres:
    image: postgres:16-alpine
    container_name: encomendas-db
    environment:
      POSTGRES_DB: ${DB_NAME:-encomendas}
      POSTGRES_USER: ${DB_USER:-encomendas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
