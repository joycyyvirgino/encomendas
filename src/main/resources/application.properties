spring.application.name=encomendas

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:encomendas}
spring.datasource.username=${DB_USER:encomendas}
spring.datasource.password=${DB_PASSWORD}

# Provisório: na semana 8 troca por Flyway + validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

server.port=8080

# Segredos sempre por variável de ambiente (ver .env)
app.jwt.secret=${JWT_SECRET:}
app.mercadopago.access-token=${MP_ACCESS_TOKEN:}
app.mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}
app.cobranca.expiracao-minutos=30
